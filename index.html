<style>
:root{--ink:#111111;--red:#E63946;--paper:#F2F3F5;--grey:#6B7280;--line:#D9DCE1}

body{margin:0;background:var(--ink);color:#fff;font-family:Poppins,system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}

.btn{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 20px;border-radius:12px;font-size:15px;font-weight:500;text-decoration:none}
.primary{background:var(--red);color:#fff}
.ghost{border:1px solid #3A3A3A;color:#fff}
