<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Function transformations · SigmaTau</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{--ink:#111111;--red:#E63946;--paper:#F2F3F5;--grey:#6B7280;--line:#D9DCE1;--tint:#FDECEE}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Poppins,system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:16px 14px 28px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.logo{display:flex;align-items:baseline;gap:8px;font-size:17px;text-decoration:none;color:var(--ink)}
.mark{font-family:"Times New Roman",serif;font-style:italic;font-weight:700;font-size:24px;line-height:1}
.mark sub{color:var(--red);font-size:15px;margin-left:1px}
.logo b{font-weight:500}.logo i{font-style:normal;font-weight:300;color:var(--red)}
.tag{background:var(--red);color:#fff;font-size:11px;font-weight:500;padding:3px 9px;border-radius:7px}
.bar{width:34px;height:5px;background:var(--red);margin-bottom:8px}
h1{font-size:24px;font-weight:500;margin:0}
.sub{color:var(--grey);font-size:13px;margin:2px 0 12px}
.card{background:#fff;border-radius:14px;padding:12px}
.formula{font-size:16px;font-weight:500;padding:4px 4px 10px;min-height:30px;line-height:1.45}
.formula em{font-family:"Times New Roman",serif;font-size:19px}
canvas{width:100%;height:56vh;max-height:420px;min-height:260px;display:block;touch-action:none}
.controls{margin-top:12px;display:grid;gap:4px}
.row{display:grid;grid-template-columns:96px 1fr 46px;align-items:center;gap:10px;min-height:38px}
.row label{font-size:13px;color:var(--grey)}
.row output{font-size:14px;font-weight:500;text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;background:var(--line);border-radius:2px;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:var(--red);border:3px solid #fff;box-shadow:0 0 0 1px var(--red)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--red);border:3px solid #fff}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 6px}
.chip{border:1px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-size:13px;padding:7px 13px;border-radius:20px}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.toggle{display:flex;align-items:center;justify-content:space-between;min-height:40px;font-size:14px}
.sw{position:relative;width:46px;height:26px}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:var(--line);border-radius:13px;transition:.2s}
.sw span:before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.sw input:checked+span{background:var(--red)}
.sw input:checked+span:before{transform:translateX(20px)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:8px;margin-top:10px}
.stat{background:var(--paper);border-radius:10px;padding:8px 10px}
.stat small{display:block;color:var(--grey);font-size:11px}
.stat b{font-size:17px;font-weight:500}
.stat.red{background:var(--tint)}.stat.red b{color:var(--red)}
.hint{color:var(--grey);font-size:12px;margin-top:10px}
footer{margin-top:16px;color:var(--grey);font-size:11px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
<header><a class="logo" href="../" aria-label="All visualizations"><span class="mark">σ<sub>τ</sub></span><span><b>Sigma</b><i>Tau</i></span></a><span class="tag">Functions</span></header>
<div class="bar"></div>
<h1>Function transformations</h1>
<div class="sub">y = a · f(b(x − c)) + d — stretch, compress, shift, reflect</div>
<div class="card">
<div class="formula" id="formula"></div>
<canvas id="cv"></canvas>
</div>
<div class="card controls">
<div class="chips"><button class="chip on" data-g="f" data-v="sin">sin x</button><button class="chip" data-g="f" data-v="sq">x²</button><button class="chip" data-g="f" data-v="abs">|x|</button><button class="chip" data-g="f" data-v="exp">eˣ</button><button class="chip" data-g="f" data-v="cube">x³</button></div><div class="row"><label for="a">a · vertical</label><input type="range" id="a" min="-3" max="3" step="0.1" value="1"><output id="ao"></output></div><div class="row"><label for="b">b · horizontal</label><input type="range" id="b" min="-3" max="3" step="0.1" value="1"><output id="bo"></output></div><div class="row"><label for="c">c · shift right</label><input type="range" id="c" min="-4" max="4" step="0.1" value="0"><output id="co"></output></div><div class="row"><label for="d">d · shift up</label><input type="range" id="d" min="-3" max="3" step="0.1" value="0"><output id="do"></output></div><label class="toggle">Show original f(x)<span class="sw"><input type="checkbox" id="base" checked><span></span></span></label>
</div>
<div class="stats" id="stats"></div>
<div class="hint">Try a negative a (reflection in the x-axis) or a negative b (reflection in the y-axis).</div>
<footer><a href="../#calculus" style="color:inherit">← All visualizations</a> · SigmaTau · visualizations</footer>
</div>
<script>
const C={ink:"#111111",red:"#E63946",grey:"#6B7280",line:"#D9DCE1",soft:"#9CA3AF",tint:"rgba(230,57,70,0.14)"};
const cv=document.getElementById("cv"),ctx=cv.getContext("2d");
let V={xmin:-5,xmax:5,ymin:-4,ymax:4};
let W=0,H=0;
const X=x=>(x-V.xmin)/(V.xmax-V.xmin)*W, Y=y=>H-(y-V.ymin)/(V.ymax-V.ymin)*H;
const iX=px=>V.xmin+px/W*(V.xmax-V.xmin);
const $=id=>document.getElementById(id);
const fmt=(v,d=2)=>{if(!isFinite(v))return "—";const s=(+v.toFixed(d)).toString();return s.replace("-","−")};
function size(){const r=window.devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*r;cv.height=H*r;ctx.setTransform(r,0,0,r,0,0)}
function niceStep(range){const raw=range/8,p=Math.pow(10,Math.floor(Math.log10(raw))),m=raw/p;return (m<1.5?1:m<3.5?2:m<7.5?5:10)*p}
function grid(piX){
  ctx.clearRect(0,0,W,H);ctx.lineWidth=1;ctx.font="11px Poppins, sans-serif";
  const sx=piX?((V.xmax-V.xmin)>10?Math.PI:Math.PI/2):niceStep(V.xmax-V.xmin), sy=niceStep(V.ymax-V.ymin);
  ctx.strokeStyle=C.line;ctx.fillStyle=C.grey;
  for(let x=Math.ceil(V.xmin/sx)*sx;x<=V.xmax+1e-9;x+=sx){ctx.beginPath();ctx.moveTo(X(x),0);ctx.lineTo(X(x),H);ctx.stroke();
    if(Math.abs(x)>1e-9){let t=piX?piLabel(x):fmt(x,2);ctx.textAlign="center";ctx.fillText(t,X(x),Math.min(Math.max(Y(0)+15,14),H-4))}}
  for(let y=Math.ceil(V.ymin/sy)*sy;y<=V.ymax+1e-9;y+=sy){ctx.beginPath();ctx.moveTo(0,Y(y));ctx.lineTo(W,Y(y));ctx.stroke();
    if(Math.abs(y)>1e-9){ctx.textAlign="left";ctx.fillText(fmt(y,2),Math.min(Math.max(X(0)+5,3),W-24),Y(y)-4)}}
  ctx.strokeStyle=C.grey;ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(0,Y(0));ctx.lineTo(W,Y(0));ctx.moveTo(X(0),0);ctx.lineTo(X(0),H);ctx.stroke();
}
function piLabel(x){const k=Math.round(x/(Math.PI/2));if(k%2===0){const n=k/2;return n===1?"π":n===-1?"−π":fmt(n,0)+"π"}return (k<0?"−":"")+(Math.abs(k)===1?"":Math.abs(k))+"π/2"}
function curve(f,col,w,dash,a=V.xmin,b=V.xmax){
  ctx.strokeStyle=col;ctx.lineWidth=w;ctx.setLineDash(dash||[]);ctx.lineJoin="round";ctx.lineCap="round";ctx.beginPath();
  let pen=false;const n=Math.max(400,W*2);
  for(let i=0;i<=n;i++){const x=a+(b-a)*i/n,y=f(x);
    if(!isFinite(y)||Math.abs(y)>1e4){pen=false;continue}
    const py=Y(y);if(pen&&Math.abs(py-lastY)>H*1.5){pen=false}
    pen?ctx.lineTo(X(x),py):ctx.moveTo(X(x),py);pen=true;var lastY=py}
  ctx.stroke();ctx.setLineDash([]);
}
function dot(x,y,col,r=6,ring=true){ctx.beginPath();ctx.arc(X(x),Y(y),r,0,7);ctx.fillStyle=col;ctx.fill();if(ring){ctx.lineWidth=2.5;ctx.strokeStyle="#fff";ctx.stroke()}}
function stats(items){$("stats").innerHTML=items.map(([k,v,red])=>`<div class="stat${red?" red":""}"><small>${k}</small><b>${v}</b></div>`).join("")}
function bindRange(id,dec,cb){const el=$(id),o=$(id+"o");const f=()=>{o.textContent=fmt(+el.value,dec);cb()};el.addEventListener("input",f);f()}
function bindChips(group,cb){document.querySelectorAll(`[data-g="${group}"]`).forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll(`[data-g="${group}"]`).forEach(x=>x.classList.remove("on"));b.classList.add("on");cb(b.dataset.v)}))}
function chipVal(group){return document.querySelector(`[data-g="${group}"].on`).dataset.v}

const F={sin:[Math.sin,"sin"],sq:[x=>x*x,"sq"],abs:[Math.abs,"abs"],exp:[Math.exp,"exp"],cube:[x=>x*x*x,"cube"]};
let fk="sin";
function inner(b,c){const cs=c===0?"x":`x ${c>0?"−":"+"} ${fmt(Math.abs(c),1)}`;return b===1?cs:`${fmt(b,1)}(${cs})`}
function draw(){
  const a=+$("a").value,b=+$("b").value,c=+$("c").value,d=+$("d").value,f=F[fk][0];
  V=fk==="sin"?{xmin:-2*Math.PI,xmax:2*Math.PI,ymin:-4.5,ymax:4.5}:{xmin:-5,xmax:5,ymin:-4.5,ymax:4.5};
  size();grid(fk==="sin");
  if($("base").checked)curve(f,C.soft,2,[6,5]);
  curve(x=>a*f(b*(x-c))+d,C.red,3.2);
  const u=inner(b,c),pre=a===1?"":a===-1?"−":fmt(a,1)+" · ";
  const body={sin:`sin(${u})`,sq:u==="x"?"x²":`(${u})²`,abs:`|${u}|`,exp:u==="x"?"eˣ":`e^(${u})`,cube:u==="x"?"x³":`(${u})³`}[fk];
  $("formula").innerHTML=`<em>y</em> = ${pre}${body}${d? (d>0?" + ":" − ")+fmt(Math.abs(d),1):""}`;
  stats([["Vertical stretch",fmt(Math.abs(a),1)+"×"],["Horizontal",b?fmt(1/Math.abs(b),2)+"×":"—"],["Shift",`(${fmt(c,1)}, ${fmt(d,1)})`,true],["Reflections",(a<0?"x-axis ":"")+(b<0?"y-axis":"")||"none"]]);
}
["a","b","c","d"].forEach(k=>bindRange(k,1,draw));$("base").addEventListener("change",draw);
bindChips("f",v=>{fk=v;draw()});

window.addEventListener("resize",()=>{size();draw()});
size();draw();
</script>
</body>
</html>
